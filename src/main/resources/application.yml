spring:
  datasource:
    url: jdbc:h2:mem:theBarber
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      feign:
        client:
          config:
            default:
              connectTimeout: 5000
              readTimeout: 5000

      logging:
        level:
          com.theBarber.TheBarber.WSServices.WhatsAppClient: DEBUG

